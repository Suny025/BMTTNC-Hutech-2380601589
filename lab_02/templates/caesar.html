<!DOCTYPE html>
<html lang="en">
<head>
    <title>Caesar Cipher</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <style>
        body{
            background-color: #f5f7fa;
        }

        .container{
            max-width: 700px;
            margin-top: 40px;
        }

        .table{
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        .title{
            background: #0d6efd;
            color: white;
            text-align: center;
            font-weight: bold;
            font-size: 25px;
            padding: 15px;
        }

        .section-title{
            color: #0d6efd;
            font-weight: bold;
            font-size: 18px;
            padding-top: 15px;
        }

        .form-control{
            border-radius: 8px;
        }

        .btn-primary{
            border-radius: 8px;
            min-width: 120px;
        }

        label{
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="container">
    <table class="table">

        <!-- TITLE -->
        <tr>
            <td class="title">CAESAR CIPHER</td>
        </tr>

        <!-- ENCRYPT -->
        <tr>
            <td class="section-title">ENCRYPTION</td>
        </tr>

        <tr>
            <td>
                <form method="POST" action="/caesar/encrypt">

                    <div class="mb-3">
                        <label>Plain text:</label>
                        <input type="text"
                               class="form-control"
                               name="inputPlainText"
                               placeholder="Input Plain Text"
                               pattern="^[A-Za-z ]+$"
                               title="Chỉ nhập chữ cái A-Z và khoảng trắng"
                               oninput="this.value = this.value.toUpperCase()"
                               required
                               autofocus>
                    </div>

                    <div class="mb-3">
                        <label>Key:</label>
                        <input type="number"
                               class="form-control"
                               name="inputKeyPlain"
                               placeholder="Input Key (1-25)"
                               min="1"
                               max="25"
                               step="1"
                               required>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Encrypt
                    </button>

                </form>
            </td>
        </tr>

        <!-- DECRYPT -->
        <tr>
            <td class="section-title">DECRYPTION</td>
        </tr>

        <tr>
            <td>
                <form method="POST" action="/caesar/decrypt">

                    <div class="mb-3">
                        <label>Cipher text:</label>
                        <input type="text"
                               class="form-control"
                               name="inputCipherText"
                               placeholder="Input Cipher Text"
                               pattern="^[A-Za-z ]+$"
                               title="Chỉ nhập chữ cái A-Z và khoảng trắng"
                               oninput="this.value = this.value.toUpperCase()"
                               required>
                    </div>

                    <div class="mb-3">
                        <label>Key:</label>
                        <input type="number"
                               class="form-control"
                               name="inputKeyCipher"
                               placeholder="Input Key (1-25)"
                               min="1"
                               max="25"
                               step="1"
                               required>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Decrypt
                    </button>

                </form>
            </td>
        </tr>

    </table>
</div>

</body>
</html>
