<!DOCTYPE html>
<html lang="en">
<head>
    <title>Rail Fence Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <style>
        body{
            background-color: #f5f7fa;
        }

        .container{
            max-width: 700px;
            margin-top: 40px;
        }

        .table{
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        .title{
            background: #fd7e14;
            color: white;
            text-align: center;
            font-weight: bold;
            font-size: 25px;
            padding: 15px;
        }

        .section-title{
            color: #fd7e14;
            font-weight: bold;
            font-size: 18px;
            padding-top: 15px;
        }

        .form-control{
            border-radius: 8px;
        }

        .btn-primary{
            background: #fd7e14;
            border: none;
            border-radius: 8px;
            min-width: 120px;
        }

        .btn-primary:hover{
            background: #e76b00;
        }

        label{
            font-weight: 500;
        }
    </style>
</head>

<body>

    <div class="container">
        <table class="table">

            <tr>
                <td class="title">
                    RAIL FENCE CIPHER
                </td>
            </tr>

            <tr>
                <td class="section-title">
                    ENCRYPTION
                </td>
            </tr>

            <tr>
                <td>
                    <form method="POST" action="/railfence/encrypt">

                        <div class="mb-3">
                            <label class="form-label">Plain text:</label>
                            <input type="text"
                                   class="form-control"
                                   name="inputPlainText"
                                   placeholder="Input Plain Text"
                                   pattern="[A-Za-z ]+"
                                   title="Chỉ được nhập chữ cái và khoảng trắng"
                                   required
                                   autofocus>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Key:</label>
                            <input type="number"
                                   class="form-control"
                                   name="inputKeyPlain"
                                   placeholder="Input Key"
                                   min="2"
                                   title="Key phải lớn hơn hoặc bằng 2"
                                   required>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Encrypt
                        </button>

                    </form>
                </td>
            </tr>

            <tr>
                <td class="section-title">
                    DECRYPTION
                </td>
            </tr>

            <tr>
                <td>
                    <form method="POST" action="/railfence/decrypt">

                        <div class="mb-3">
                            <label class="form-label">Cipher text:</label>
                            <input type="text"
                                   class="form-control"
                                   name="inputCipherText"
                                   placeholder="Input Cipher Text"
                                   pattern="[A-Za-z ]+"
                                   title="Chỉ được nhập chữ cái và khoảng trắng"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Key:</label>
                            <input type="number"
                                   class="form-control"
                                   name="inputKeyCipher"
                                   placeholder="Input Key"
                                   min="2"
                                   title="Key phải lớn hơn hoặc bằng 2"
                                   required>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Decrypt
                        </button>

                    </form>
                </td>
            </tr>

        </table>
    </div>

</body>
</html>
